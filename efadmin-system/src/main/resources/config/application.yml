server:
  port: 8000

spring:
  main:
    allow-bean-definition-overriding: true
  freemarker:
    check-template-location: false
  profiles:
    active: dev
  jackson:
    time-zone: GMT+8
  data:
    redis:
      repositories:
        enabled: false
  datasource:
    type: com.alibaba.druid.pool.DruidDataSource
    # 主数据源指向租户元数据库（存储租户信息的库）db_ef_tenants db_efadmin1 db_efadmin2
    url: jdbc:mysql://localhost:3306/db_ef_tenants?useSSL=false&serverTimezone=Asia/Shanghai&characterEncoding=utf8&allowPublicKeyRetrieval=true
    username: root  # 你的数据库用户名
    password: 123456  # 你的数据库密码
    driver-class-name: com.mysql.cj.jdbc.Driver
    druid:
      initial-size: 5
      min-idle: 5
      max-active: 20
      max-wait: 60000

      # ========== Druid 监控页面配置 ==========
      stat-view-servlet:
        enabled: true  # 开启 Druid 监控页面
        url-pattern: /druid/*  # Druid 监控页面的访问路径
        allow: 127.0.0.1,localhost,192.168.0.0/24  # 按需添加内网IP段，禁止外网访问
        deny:  # 禁止访问的 IP（空表示无）
        reset-enable: false  # 关闭重置功能（安全）
      # ========== Druid 监控过滤配置 ==========
      web-stat-filter:
        enabled: true  # 开启 Web 监控过滤
        url-pattern: /*  # 监控所有请求
        exclusions: "*.js,*.gif,*.jpg,*.png,*.css,*.ico,/druid/*"  # 排除静态资源和 Druid 自身路径

  jpa:
    hibernate:
      ddl-auto: none  # 核心修正：关闭表结构校验（替代原validate）
      naming:
        physical-strategy: org.hibernate.boot.model.naming.CamelCaseToUnderscoresNamingStrategy
        implicit-strategy: org.hibernate.boot.model.naming.ImplicitNamingStrategyJpaCompliantImpl
    properties:
      hibernate:
        format_sql: false  # 调试时可改为true，生产保持false
    open-in-view: false  # 生产必关！避免事务泄漏/性能问题（原true改为false）
  redis:
    #database: 0
    host: 127.0.0.1
    port: 6379
    password:
    #连接超时时间
    timeout: 5000

task:
  pool:
    core-pool-size: 10
    max-pool-size: 30
    keep-alive-seconds: 60
    queue-capacity: 50

qiniu:
  max-size: 15

code:
  expiration: 5

loginCode:
  expiration: 2

